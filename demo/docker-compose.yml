# Local Glowroot demo: Central + Cassandra + RabbitMQ + sample Spring app with agent.
# Pattern from https://github.com/nowheresly/spring-rabbitmq-glowroot
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  cassandra:
    image: cassandra:4.1.12
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'select now() from system.local' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  glowroot:
    # Latest published Central image + matching agent dist (see sample-app Dockerfile).
    # main may already be at a newer -SNAPSHOT with no GitHub release / Docker Hub tag yet.
    image: glowroot/glowroot-central:0.14.8-beta.4
    ports:
      - "8181:8181"
      - "4000:4000"
    environment:
      CASSANDRA_CONTACT_POINTS: cassandra
    depends_on:
      cassandra:
        condition: service_healthy
    healthcheck:
      # Image has no curl; bash /dev/tcp + /health (no extra packages).
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/4000 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -qE 'HTTP/1\\.[01] 200' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  sample-app:
    build: ./sample-app
    restart: unless-stopped
    depends_on:
      glowroot:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: demo
      SPRING_RABBITMQ_PASSWORD: demo
      GLOWROOT_COLLECTOR_ADDRESS: glowroot:8181
      SPRING_RABBITMQ_LISTENER_SIMPLE_MISSING_QUEUES_FATAL: "false"

# Copy next to glowroot-central.jar (dist root, not conf\) to exercise storage.type=postgres.
# See docs/central-postgresql-storage.md and demo/postgres/README.md.

storage.type=postgres
postgres.jdbcUrl=jdbc:postgresql://127.0.0.1:5432/glowroot
postgres.username=glowroot
postgres.password=glowroot
postgres.maximumPoolSize=10

# Still required for secret encryption (same property name as Cassandra path).
# DEMO ONLY — all-zero key is insecure; generate a real 32-hex key for any shared/deployed use.
cassandra.symmetricEncryptionKey=00000000000000000000000000000000

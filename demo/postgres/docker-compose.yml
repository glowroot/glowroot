# Local Postgres for experimental Central storage.type=postgres
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: glowroot
      POSTGRES_USER: glowroot
      POSTGRES_PASSWORD: glowroot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowroot -d glowroot"]
      interval: 3s
      timeout: 3s
      retries: 20

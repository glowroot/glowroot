name: Reusable - Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        java: [ 8, 17, 21, 25 ]
        testGroup: [ 1, 2, 3, 4 ]
        testShaded: [ true, false ]
        glowrootHarness: [ javaagent, local ]
        exclude:
          # glowroot-central and glowroot-webdriver-tests require Java 17+
          - java: 8
            testGroup: 3
          - java: 8
            testGroup: 4
      fail-fast: false
    env:
      TEST_SHADED: ${{ matrix.testShaded }}
      GLOWROOT_HARNESS: ${{ matrix.glowrootHarness }}
      MAVEN_OPTS: >-
        -Daether.transport.http.retryHandler.count=8
        -Daether.transport.http.retryHandler.interval=5000
        -Daether.connector.http.retryHandler.count=8
        -Daether.connector.http.retryHandler.interval=5000
    steps:
      - uses: actions/checkout@v7

      - name: Disable outbound IPv6
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          for iface in /proc/sys/net/ipv6/conf/*; do
            name=$(basename "$iface")
            if [[ "$name" != "all" && "$name" != "default" && "$name" != "lo" ]]; then
              sudo sysctl -w "net.ipv6.conf.$name.disable_ipv6=1"
            fi
          done

      - name: Set up JDK 8 for tests
        if: ${{ matrix.java == 8 }}
        run: |
          meta=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            "https://api.adoptium.net/v3/assets/feature_releases/8/ga?architecture=x64&heap_size=normal&image_type=jdk&jvm_impl=hotspot&os=linux&page=0&page_size=1&project=jdk&vendor=eclipse")
          url=$(jq -r '.[0].binaries[0].package.link' <<< "$meta")
          sha256=$(jq -r '.[0].binaries[0].package.checksum' <<< "$meta")
          if [[ -z "$url" || "$url" == "null" || ! "$sha256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Failed to resolve Adoptium JDK 8 download metadata" >&2
            exit 1
          fi
          tarball="$RUNNER_TEMP/temurin-8.tar.gz"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o "$tarball" "$url" \
                && echo "$sha256  $tarball" | sha256sum -c -; then
              break
            fi
            echo "Attempt $attempt failed JDK 8 download/checksum; retrying..." >&2
            rm -f "$tarball"
            if [[ $attempt -eq 5 ]]; then
              exit 1
            fi
            sleep 5
          done
          jdk_dir="$RUNNER_TEMP/temurin-8"
          mkdir -p "$jdk_dir"
          tar -xzf "$tarball" -C "$jdk_dir" --strip-components=1
          rm -f "$tarball"
          "$jdk_dir/bin/java" -version
          echo "TEST_JVM_PATH=$jdk_dir/bin/java" >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"

      - name: Set up JDK ${{ matrix.java }} for tests
        if: ${{ matrix.java != 17 && matrix.java != 8 }}
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up env var for java home for tests
        if: ${{ matrix.java != 17 && matrix.java != 8 }}
        run: |
          test_jvm_path_matches=(/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/${{ matrix.java }}.*/x64/bin/java)
          echo "TEST_JVM_PATH=${test_jvm_path_matches[0]}" >> $GITHUB_ENV
          cat $GITHUB_ENV

      - name: Set up JDK 17 for build
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cp .github/scripts/settings.xml ~/.m2/settings.xml

      - name: Restore cache
        id: cache-restore
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.cache/bower
          key: build-v2-test${{ matrix.testGroup }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            build-v2-test${{ matrix.testGroup }}-
            build-test${{ matrix.testGroup }}-
            build-

      - name: Build
        shell: bash
        run: xvfb-run .github/scripts/build.sh test${{ matrix.testGroup }}
        if: runner.os == 'Linux'

      - name: Save cache
        if: >-
          runner.os == 'Linux' &&
          matrix.java == 17 &&
          matrix.testShaded == true &&
          matrix.glowrootHarness == 'javaagent' &&
          steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.cache/bower
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload webdriver screenshots
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          path: /tmp/glowroot-webdriver-test-*.png
          if-no-files-found: ignore

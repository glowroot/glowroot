name: No Response

on:
  schedule:
    # Schedule for five minutes after the hour, every hour
    - cron: '5 * * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  noResponse:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/stale@v11.0.0
        with:
          repo-token: ${{ github.token }}
          only-issue-labels: 'awaiting feedback'
          stale-issue-label: 'awaiting feedback'
          days-before-issue-stale: -1
          days-before-issue-close: 30
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-stale-when-updated: true
          close-issue-message: >
            This issue has been auto-closed as awaiting feedback for 30 days.
            If you would like to continue discussing it, please feel free to
            leave a comment or re-open this issue. Thanks!
